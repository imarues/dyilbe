name: Build iKiraPlus V8 Framework Edition

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: /Users/runner/theos

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install ldid dpkg xz

      - name: Clone Theos
        run: git clone --recursive https://github.com/theos/theos.git "$THEOS"

      - name: Download SDK
        run: |
          git clone https://github.com/theos/sdks.git /tmp/sdks
          cp -R /tmp/sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"

      - name: Prepare scripts
        run: chmod +x scripts/*.sh

      - name: Validate framework plists
        shell: bash
        run: |
          set -euo pipefail
          for p in FrameworkResources/*/Info.plist; do
            plutil -lint "$p"
          done

      - name: Build two dylibs and five frameworks
        run: make clean all

      - name: Collect exact products
        shell: bash
        run: |
          set -euo pipefail
          out="output/Frameworks"
          rm -rf output
          mkdir -p "$out"

          # Theos can place products under different architecture-specific
          # object directories depending on the current Theos revision.
          # Do not hard-code .theos/obj/arm64; locate the exact built product.
          find_product() {
            local pattern="$1"
            find .theos/obj -type f -path "$pattern" -print -quit 2>/dev/null
          }

          for name in iKiraPlus UIDisplayServices; do
            src="$(find_product "*/$name.dylib")"
            if [[ -z "$src" || ! -s "$src" ]]; then
              echo "ERROR: could not find built $name.dylib under .theos/obj" >&2
              echo "Built files:" >&2
              find .theos/obj -type f -maxdepth 8 -print | sort >&2 || true
              exit 1
            fi
            echo "Collecting $src"
            ditto "$src" "$out/$name.dylib"
          done

          for name in UIInfrastructure CoreLifecycle ProcessServices ProcessSupport SystemEnvironment; do
            src="$(find_product "*/$name.framework/$name")"
            if [[ -z "$src" || ! -s "$src" ]]; then
              echo "ERROR: could not find built $name.framework/$name under .theos/obj" >&2
              echo "Built framework files:" >&2
              find .theos/obj -type f -path "*/$name.framework/*" -print | sort >&2 || true
              exit 1
            fi

            fw="${src%/$name}"
            [[ -f "$fw/Info.plist" ]] || { echo "ERROR: missing $fw/Info.plist" >&2; exit 1; }
            echo "Collecting $fw"
            ditto "$fw" "$out/$name.framework"
          done

      - name: Validate final products
        shell: bash
        run: bash ./scripts/validate_products.sh output/Frameworks

      - name: Print Mach-O diagnostics
        shell: bash
        run: |
          set -euo pipefail
          for f in output/Frameworks/iKiraPlus.dylib output/Frameworks/UIDisplayServices.dylib; do
            echo "===== $f ====="
            file "$f" || true
            xcrun lipo -info "$f"
            otool -D "$f" || true
            otool -L "$f"
          done
          for name in UIInfrastructure CoreLifecycle ProcessServices ProcessSupport SystemEnvironment; do
            f="output/Frameworks/$name.framework/$name"
            echo "===== $f ====="
            file "$f" || true
            xcrun lipo -info "$f"
            otool -D "$f"
            otool -L "$f"
            plutil -p "output/Frameworks/$name.framework/Info.plist"
          done

      - name: Write checksums
        shell: bash
        run: |
          set -euo pipefail
          cd output
          {
            shasum -a 256 Frameworks/iKiraPlus.dylib
            shasum -a 256 Frameworks/UIDisplayServices.dylib
            for name in UIInfrastructure CoreLifecycle ProcessServices ProcessSupport SystemEnvironment; do
              shasum -a 256 "Frameworks/$name.framework/$name"
              shasum -a 256 "Frameworks/$name.framework/Info.plist"
            done
          } > SHA256SUMS.txt

      - name: Write deployment guide
        shell: bash
        run: |
          cat > output/INJECTION.txt <<'TXT'
          V8 Framework Edition deployment
          ===============================

          Copy the CONTENTS of output/Frameworks/ into:
            Payload/<App>.app/Frameworks/

          The final layout must be:
            Frameworks/iKiraPlus.dylib
            Frameworks/UIDisplayServices.dylib
            Frameworks/UIInfrastructure.framework/UIInfrastructure
            Frameworks/CoreLifecycle.framework/CoreLifecycle
            Frameworks/ProcessServices.framework/ProcessServices
            Frameworks/ProcessSupport.framework/ProcessSupport
            Frameworks/SystemEnvironment.framework/SystemEnvironment

          Directly inject/load ONLY:
            @executable_path/Frameworks/iKiraPlus.dylib
            @executable_path/Frameworks/UIDisplayServices.dylib

          Do NOT directly inject the five frameworks. UIDisplayServices loads them
          from their framework bundles with dlopen().

          The final signer must sign the two dylibs and all five framework bundles
          as nested code, then sign the containing .app.
          TXT

      - uses: actions/upload-artifact@v4
        with:
          name: iKiraPlus-V8-Framework-Edition
          path: output/
          if-no-files-found: error
